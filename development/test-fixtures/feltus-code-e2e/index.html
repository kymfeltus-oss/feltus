<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FELTUS CODE E2E Fixture</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f6fb; color: #192235; }
      body { margin: 0; padding: 3rem 1.25rem; }
      main { max-width: 42rem; margin: 0 auto; }
      .card { padding: 2rem; border: 1px solid #dce2ee; border-radius: 1rem; background: white; box-shadow: 0 1rem 2.5rem #19223512; }
      h1 { margin-top: 0; font-size: clamp(1.7rem, 4vw, 2.3rem); }
      p { line-height: 1.6; }
      button { border: 0; border-radius: .6rem; padding: .75rem 1rem; background: #5142bd; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid #8b80ed; outline-offset: 3px; }
      #result { min-height: 1.6em; color: #31425c; }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="title">
        <p>BUILD STUDIO TEST FIXTURE</p>
        <h1 id="title">Your preview is ready</h1>
        <p>This small local app is a safe starting point for the Build Studio browser test.</p>
        <button id="try-button" type="button">Try the app</button>
        <p id="result" aria-live="polite">The button has not been pressed yet.</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
