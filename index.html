<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FELTUS LABS — Build your app</title>
  <link rel="stylesheet" href="/app-wizard.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="FELTUS home"><span class="brand-mark">F</span><span>FELTUS <small>LABS</small></span></a>
      <div class="topbar-right"><span id="saved-indicator" class="saved-indicator" aria-live="polite"></span><button id="top-create" class="button button-primary" type="button" hidden>Create new app</button></div>
    </header>
    <main id="view" tabindex="-1" aria-live="polite"><div class="loading-card">Loading your workspace…</div></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="/app-wizard.js"></script>
</body>
</html>
