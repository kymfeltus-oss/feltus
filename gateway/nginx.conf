events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8000;
    server_name _;
    client_max_body_size 20m;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /auth/v1 {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /rest/v1 {
      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
    }

    location /rest/v1/ {
      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
    }

    location = /storage/v1 {
      proxy_pass http://storage:5000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Path /storage/v1;
    }

    location /storage/v1/ {
      proxy_pass http://storage:5000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Path /storage/v1;
    }

    location /realtime/v1/ {
      proxy_pass http://realtime:4000/socket/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host realtime-dev.supabase-realtime;
      proxy_set_header X-Forwarded-Host $host;
    }

    location / {
      return 404;
    }
  }
}
